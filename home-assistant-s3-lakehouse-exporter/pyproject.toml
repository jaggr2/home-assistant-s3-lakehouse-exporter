[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a running S3-compatible endpoint (MinIO); run with -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["exporter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
