# Local integration convenience for the Home Assistant S3 Lakehouse Exporter.
# NOT used by CI. Starts a single-container S3-compatible object store with a
# `ha-lakehouse` bucket and a scoped `ha-exporter` identity (read/write/list
# on that bucket only) — a realistic stand-in for production S3 / MinIO / R2 /
# Garage.
#
#   docker compose up
#
# S3 API:  http://localhost:8333
# UI:      http://localhost:8888
#
# Then run the integration tests:
#
#   HA_EXPORTER_TEST_S3_ENDPOINT=http://127.0.0.1:8333 \
#   HA_EXPORTER_TEST_S3_ACCESS_KEY=ha-exporter \
#   HA_EXPORTER_TEST_S3_SECRET_KEY=ha-exporter-secret-change-me \
#   HA_EXPORTER_TEST_S3_BUCKET=ha-lakehouse \
#   pytest -m integration
#
# or point the add-on config at it:
#
#   s3:
#     bucket: "ha-lakehouse"
#     prefix: "home-assistant"
#     endpoint_url: "http://<host>:8333"   # from the add-on's point of view
#     path_style: true
#   auth:
#     access_key_id: "ha-exporter"
#     secret_access_key: "ha-exporter-secret-change-me"
#   format:
#     type: "parquet"                      # or "jsonl" — no catalog needed
#
# NOTE: if the add-on runs on the same Docker network, use
# http://seaweedfs:8333 as the endpoint; otherwise use the host's address.
#
# The store is SeaweedFS (`chrislusf/seaweedfs`, S3-compatible, path-style).
# MinIO was used here before, but MinIO Community Edition is archived and its
# container images are no longer publicly distributed (Docker Hub removed in
# September 2026; quay.io now requires a login), which broke fresh pulls.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data -s3.config=/etc/seaweedfs/s3.json -bucket=ha-lakehouse
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer UI
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
