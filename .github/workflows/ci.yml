name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jaggr2/home-assistant-s3-lakehouse-exporter

jobs:
  # Lint + unit tests. Kept light; release-time version/changelog checks live
  # in the release job only.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: home-assistant-s3-lakehouse-exporter/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r home-assistant-s3-lakehouse-exporter/requirements-dev.txt
      - name: Ruff
        run: ruff check .
        working-directory: home-assistant-s3-lakehouse-exporter
      - name: Pytest
        run: pytest
        working-directory: home-assistant-s3-lakehouse-exporter
      - name: Check version consistency
        working-directory: home-assistant-s3-lakehouse-exporter
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(grep -E '^version:' config.yaml | head -n1 | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          CODE_VERSION="$(grep -E '__version__ =' exporter/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "config.yaml version: ${CONFIG_VERSION} / package __version__: ${CODE_VERSION}"
          if [ "${CONFIG_VERSION}" != "${CODE_VERSION}" ]; then
            echo "::error::config.yaml version and exporter/__init__.py __version__ must match"
            exit 1
          fi

  # Runs the S3 integration suite against a SeaweedFS service container. The
  # same suite is opt-in locally (pytest -m integration, see docker-compose.yml).
  integration:
    runs-on: ubuntu-latest
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        ports:
          - "8333:8333"
        env:
          AWS_ACCESS_KEY_ID: ha-exporter
          AWS_SECRET_ACCESS_KEY: ha-exporter-secret-change-me
          S3_BUCKET: ha-lakehouse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: home-assistant-s3-lakehouse-exporter/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r home-assistant-s3-lakehouse-exporter/requirements-dev.txt
      - name: Wait for the S3 endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8333; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::SeaweedFS S3 endpoint did not come up"
          exit 1
      - name: Integration tests
        working-directory: home-assistant-s3-lakehouse-exporter
        env:
          HA_EXPORTER_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          HA_EXPORTER_TEST_S3_ACCESS_KEY: ha-exporter
          HA_EXPORTER_TEST_S3_SECRET_KEY: ha-exporter-secret-change-me
          HA_EXPORTER_TEST_S3_BUCKET: ha-lakehouse
        run: pytest -m integration

  # PR-only image build (no push). The build args must carry a per-arch base
  # image, so each platform is built in its own matrix leg.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: home-assistant-s3-lakehouse-exporter
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: home-assistant-s3-lakehouse-exporter:ci-${{ matrix.arch }}

  # Tagged releases: verify the tag against config.yaml and CHANGELOG.md, then
  # build and push per-arch images. A separate job assembles the single
  # multi-arch manifest that config.yaml's image: reference expects.
  #
  # Fallback (see AGENTS.md): if the Supervisor cannot pull a manifest list,
  # push per-arch tags instead — ghcr.io/jaggr2/{arch}-home-assistant-s3-lakehouse-exporter
  # — and switch config.yaml's image: to the {arch} placeholder form.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches config.yaml version
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' home-assistant-s3-lakehouse-exporter/config.yaml | head -n1 | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          CODE_VERSION="$(grep -E '__version__ =' home-assistant-s3-lakehouse-exporter/exporter/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "config.yaml version: ${VERSION} / package __version__: ${CODE_VERSION}"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read version from home-assistant-s3-lakehouse-exporter/config.yaml"
            exit 1
          fi
          if [ "${VERSION}" != "${CODE_VERSION}" ]; then
            echo "::error::config.yaml version and exporter/__init__.py __version__ must match"
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match config.yaml version v${VERSION}. Bump config.yaml before tagging."
            exit 1
          fi

      - name: Verify CHANGELOG.md documents this version
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' home-assistant-s3-lakehouse-exporter/config.yaml | head -n1 | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading. A release requires a config.yaml version bump and a CHANGELOG entry."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: home-assistant-s3-lakehouse-exporter
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  # Assemble the single multi-arch manifest referenced by config.yaml (no
  # {arch} placeholder), tagged :vX.Y.Z and :latest. The per-arch images from
  # the release job remain available as :vX.Y.Z-<arch> and double as the
  # documented fallback if the Supervisor rejects manifest lists.
  release-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-aarch64"
